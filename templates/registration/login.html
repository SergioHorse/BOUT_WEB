{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h1 class="h3 mb-3">Iniciar sesión</h1>

    {% if form.errors %}
      <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
    {% endif %}

    <form method="post" class="card card-body">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
        
        <div class="row mb-3 align-items-center">
            <div class="col-md-3">
                <label for="{{ form.username.id_for_label }}" class="col-form-label mb-0">
                    Usuario
                </label>
            </div>
            <div class="col-md-9">
                {{ form.username }}
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <div class="col-md-3">
                <label for="{{ form.password.id_for_label }}" class="col-form-label mb-0">
                    Contraseña
                </label>
            </div>
            <div class="col-md-9">
                {{ form.password }}
            </div>
        </div>

        <div class="row">
            <div class="offset-md-3 col-md-9">
                <button type="submit" class="btn btn-primary w-50">
                    Entrar
                </button>
            </div>
        </div>
    </form>
  </div>
</div>
{% endblock %}
