<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de sesión</title>
</head>
<body>.

    <h2>Acceso a empleados</h2>

    {% if form.errors %}
        
        <p>Las credenciales del usuario no coinciden</p>

    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input
                type="hidden"
                name="next"
                value={{ next }}
                
        ></input>
        <button type="submit">
            Iniciar sesión
        </button>
    </form>

</body>
</html>
